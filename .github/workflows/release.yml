# Builds the Linux and Windows packages and publishes a GitHub release.
#
# Release:    push a tag matching the pubspec version, e.g.
#               git tag -a v1.0.0 -m "Joomla Poster 1.0.0"
#               git push origin v1.0.0
# Test build: run the workflow manually (Actions → Release → Run
#             workflow). It builds all packages and attaches them to the
#             workflow run as artifacts, without creating a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  linux:
    # Built on the oldest supported Ubuntu so the binary also runs on older
    # distributions (glibc is backwards- but not forwards-compatible).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Read version from pubspec.yaml
        id: version
        run: |
          version="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - run: packaging/linux/build_packages.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Read version from pubspec.yaml
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      # Analyze and tests run in the Linux job; the code is the same.
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Check that the VC++ runtime DLLs are bundled
        shell: bash
        run: |
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            if [ ! -f "build/windows/x64/runner/Release/$dll" ]; then
              echo "::error::$dll is missing next to the exe"
              exit 1
            fi
          done

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build zip
        shell: pwsh
        run: |
          $name = "joomla-poster-${{ steps.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Force staging, dist | Out-Null
          Copy-Item build\windows\x64\runner\Release -Destination "staging\$name" -Recurse
          Copy-Item LICENSE "staging\$name\LICENSE.txt"
          Compress-Archive -Path "staging\$name" -DestinationPath "dist\$name.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums for all files
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          name: Joomla Poster ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
